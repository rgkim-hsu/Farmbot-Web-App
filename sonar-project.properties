# SonarCloud 프로젝트 정보
sonar.projectKey=rgkim-hsu_Farmbot-Web-App
sonar.organization=rgkim-hsu

# 프로젝트 메타데이터
sonar.projectName=FarmBot Web Application
sonar.projectVersion=1.0

# 소스 코드 위치
sonar.sources=webpack,app
sonar.tests=spec,__tests__

# TypeScript 설정
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# 제외할 파일/폴더
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/public/**,**/*.spec.ts,**/*.test.ts,**/*.d.ts

# 중복 코드 검사
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts